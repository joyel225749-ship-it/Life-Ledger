<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LifeLedger — Redirecting…</title>
    <!--
      GitHub Pages SPA fix.
      When a user refreshes on /Life-Ledger/products or navigates directly
      to a React Router path, GitHub Pages returns this 404.html.
      This script encodes the full URL into a query-string, then redirects
      to index.html, which reads it back and replaces history so React Router
      sees the correct path.

      Credit: https://github.com/rafgraph/spa-github-pages
      (MIT licence)
    -->
    <script>
      // Number of path segments to keep as the "repo" prefix.
      // For https://user.github.io/Life-Ledger/ this is 1.
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
