name: Deploy Frontend to GitHub Pages

# Runs on every push to main, or manually from the Actions tab
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Required permissions for the official GitHub Pages deployment
permissions:
  contents: read   # read the repo source
  pages: write     # publish to GitHub Pages
  id-token: write  # verify the deployment origin

# Only allow one deployment at a time; cancel pending runs if a new push arrives
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and deploy React app
    runs-on: ubuntu-latest

    # Links this job to the github-pages environment so GitHub shows the URL
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 1 — Check out the full repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2 — Install Node.js 20 LTS and cache npm packages
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      # 3 — Install only production-locked dependencies
      - name: Install dependencies
        working-directory: client
        run: npm ci

      # 4 — Build the Vite app
      #     vite.config.js sets base='/Life-Ledger/' when command === 'build'
      #     VITE_API_URL is read from GitHub → Settings → Secrets → Actions
      #     If the secret is not set yet, the frontend still builds fine
      #     (API calls will fail until the backend is deployed on Render)
      - name: Build Vite app
        working-directory: client
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      # 5 — Configure the GitHub Pages environment
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      # 6 — Upload the built dist/ folder as a Pages artifact
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist   # the folder vite build outputs to

      # 7 — Deploy the artifact to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
