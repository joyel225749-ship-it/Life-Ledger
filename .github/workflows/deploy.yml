# .github/workflows/deploy.yml
#
# Builds the React/Vite frontend from the `client` folder and deploys
# the built `dist/` output to GitHub Pages.
#
# ── Trigger ──────────────────────────────────────────────────────────
# Runs automatically on every push to `main`.
# Can also be triggered manually from the Actions tab.
#
# ── What it does NOT do ──────────────────────────────────────────────
# It does NOT deploy the backend (server/).
# It does NOT expose .env files or secrets.

name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:   # allow manual trigger from GitHub Actions tab

# Give the workflow permission to write to the gh-pages branch
permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build React app and deploy
    runs-on: ubuntu-latest

    steps:
      # 1 — Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2 — Set up Node.js (LTS)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      # 3 — Install client dependencies
      - name: Install dependencies
        working-directory: client
        run: npm ci

      # 4 — Build the Vite app
      #     VITE_API_URL points to the deployed backend.
      #     If you have not deployed a backend yet, leave it blank —
      #     the demo/login pages will still render; API calls will fail
      #     until you set this secret in GitHub → Settings → Secrets.
      - name: Build
        working-directory: client
        env:
          # Set this secret in GitHub → Settings → Secrets → Actions
          # e.g. https://lifeledger-api.onrender.com
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      # 5 — Deploy dist/ to the gh-pages branch
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: client/dist
          # Keep the custom 404.html that handles React Router paths
          force_orphan: false
