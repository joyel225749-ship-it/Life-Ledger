services:
  - type: web
    name: lifeledger-api
    runtime: node
    buildCommand: cd server && npm install
    startCommand: cd server && node src/index.js
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://joyel225749-ship-it.github.io
      - key: NODE_ENV
        value: production
      - key: MAX_UPLOAD_MB
        value: "8"
