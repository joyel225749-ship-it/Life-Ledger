# render.yaml — Render.com Blueprint
# Defines both the backend API and the frontend static site.
# Docs: https://render.com/docs/blueprint-spec

services:
  # ── Backend (Node.js / Express) ──────────────────────────────────
  - type: web
    name: lifeledger-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false          # You paste this in the Render dashboard
      - key: JWT_SECRET
        generateValue: true  # Render auto-generates a secure random value
      - key: CLIENT_ORIGIN
        sync: false          # You paste the frontend URL after it deploys
      - key: MAX_UPLOAD_MB
        value: "8"

  # ── Frontend (React / Vite static build) ─────────────────────────
  - type: web
    name: lifeledger-app
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      # Send all routes to index.html so React Router works
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false          # You paste the backend URL (lifeledger-api.onrender.com)
